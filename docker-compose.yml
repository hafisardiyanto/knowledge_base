version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - kb-network

  web:
    image: nginx:alpine
    container_name: kb_nginx
    restart: unless-stopped
    ports:
      - "8098:80"  # Port Baru yang tidak bentrok!
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kb-network

  db:
    image: mysql:8.0
    container_name: kb_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-knowledge_base}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-user}
    ports:
      - "3313:3306" # Port MySQL Baru yang tidak bentrok!
    volumes:
      - kb_dbdata:/var/lib/mysql
    networks:
      - kb-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: kb_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8099:80" # Port PMA Baru yang tidak bentrok!
    depends_on:
      - db
    networks:
      - kb-network

networks:
  kb-network:
    driver: bridge

volumes:
  kb_dbdata:
