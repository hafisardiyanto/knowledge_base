version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - kb-network

  web:
    image: nginx:alpine
    container_name: kb_nginx
    restart: unless-stopped
    ports:
      - "8098:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kb-network

  db:
    image: mysql:8.0
    container_name: kb_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: knowledge_base_generator
      MYSQL_ROOT_PASSWORD: password_root_rahasia
      MYSQL_USER: user_laravel
      MYSQL_PASSWORD: password_laravel
    ports:
      - "3313:3306"
    volumes:
      - kb_dbdata:/var/lib/mysql
    networks:
      - kb-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: kb_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: password_root_rahasia
    ports:
      - "8099:80"
    depends_on:
      - db
    networks:
      - kb-network

networks:
  kb-network:
    driver: bridge

volumes:
  kb_dbdata:

